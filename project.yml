name: ArtCraftMobileOffline
options:
  bundleIdPrefix: nl.artcraftmobile
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
    GENERATE_INFOPLIST_FILE: 'YES'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
    INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'Foto’s importeren voor offline beeldbewerking.'
packages:
  StableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion.git
    branch: main
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  ArtCraftMobileOffline:
    type: application
    platform: iOS
    dependencies:
      - package: StableDiffusion
        product: StableDiffusion
      - package: ZIPFoundation
        product: ZIPFoundation
    sources:
      - App
      - Models
      - Views
      - Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.artcraftmobile.offline
